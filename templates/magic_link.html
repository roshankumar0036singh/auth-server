<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Sign in</title>
</head>

<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <h2>Sign in to {{.AppName}}</h2>
        <p>Use the button below to sign in without a password. The link is
            valid for 15 minutes and can only be used once.</p>
        <p>
            <a href="{{.MagicLink}}"
               style="display:inline-block; padding:12px 24px; background:#4f46e5; color:#ffffff; text-decoration:none; border-radius:6px;">
                Sign in
            </a>
        </p>
        <p>If you did not request this link, you can safely ignore this email.</p>
    </div>
</body>

</html>
